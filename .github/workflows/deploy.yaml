name: deploy

on:
  push:
    tags:
      - draft-*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Cache setup
      id: cache-setup
      run: |
        mkdir -p "$HOME"/.cache/xml2rfc
        echo "::set-output name=path::$HOME/.cache/xml2rfc"
        date -u "+::set-output name=date::%FT%T"
    - name: Cache references
      uses: actions/cache@v5
      with:
        path: ${{ steps.cache-setup.outputs.path }}
        key: refcache-${{ steps.cache-setup.outputs.date }}
        restore-keys: |
          refcache-${{ steps.cache-setup.outputs.date }}
          refcache-
    - name: Assemble draft
      run: |
          awk 'FNR==1 && NR!=1 {printf "\n"} 1' src/*.md > draft-stb-tls13.md
          cp -f scripts/makefile .
    - name: Build draft
      uses: martinthomson/i-d-template@v1
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: stb-tls13
        path: draft-stb-tls13.*
        retention-days: 3
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: stb-tls13
    - name: Display structure of downloaded files
      run: ls -r
    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload html asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./draft-stb-tls13.html
        asset_name: draft-stb-tls13.html
        asset_content_type: application/html
    - name: Upload txt asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./draft-stb-tls13.txt
        asset_name: draft-stb-tls13.txt
        asset_content_type: application/txt
